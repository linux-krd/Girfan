html,body{height:100%;margin:0;overflow:hidden}

.page.before{transform:translateX(calc(var(--s)*-40px))}
.page.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
.hero{text-align:center;padding:40px 0 44px}

.nm{font-weight:600;font-size:16px}.sb{color:var(--mut);font-size:13px;margin-top:2px}
.am{font-weight:600;white-space:nowrap}.day b{color:var(--tx)}
.big .cr{margin-inline:6px 0}.big>span,.big sup,bdi{unicode-bidi:isolate}
.inc{color:var(--gr)}
.empty{text-align:center;color:var(--mut);padding:40px 0;line-height:2}

.sum b{display:block;font-size:15px;margin-top:4px;color:var(--tx)}
.bar{margin:12px 0}.bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}

.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.set.col{flex-direction:column;align-items:stretch}
select,input[type=text],input[type=email]{font:inherit;color:var(--tx);background:var(--card);border:0;border-radius:12px;padding:12px;width:100%;outline:0}
.set select{width:auto;min-width:140px}
.themes{display:flex;gap:14px;justify-content:space-around;margin-top:6px}
.chip{background:0;border:0;font:inherit;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.chip i{width:42px;height:42px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--line);transition:box-shadow .25s,transform .25s}
.chip.on{color:var(--tx);font-weight:600}.chip.on i{box-shadow:0 0 0 3px var(--acc);transform:scale(1.08)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.btns button{font:inherit;background:var(--card);color:var(--tx);border:0;border-radius:14px;padding:13px;cursor:pointer;font-weight:500}
.danger{color:#e5484d;background:0;border:0;font:inherit;padding:18px 0;cursor:pointer;width:100%}
.search{margin-bottom:14px}
nav{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);inset-inline:14px;height:70px;background:var(--nav);border-radius:26px;display:flex;align-items:center;justify-content:space-around;box-shadow:0 8px 30px #0003;z-index:10;transition:background .4s}
.hl{position:absolute;top:8px;left:0;height:54px;width:60px;border-radius:18px;border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);transition:transform .5s cubic-bezier(.3,1.15,.5,1),width .5s cubic-bezier(.3,1.15,.5,1),border-color .4s;pointer-events:none}
nav button{position:relative;z-index:1;background:0;border:0;cursor:pointer;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:11px;font-weight:600;padding:0 6px;height:54px;min-width:56px;transition:color .3s}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
nav button.on{color:var(--acc)}nav button.on svg{transform:scale(1.1)}
nav button.plus{background:var(--btn);color:#fff;width:52px;height:52px;min-width:52px;border-radius:50%;justify-content:center;padding:0;box-shadow:0 4px 14px #0004;transition:transform .2s}
nav button.plus:active{transform:scale(.9)}
nav button.plus svg{width:26px;height:26px;stroke-width:2.4}
@media (prefers-color-scheme:dark){html[data-theme=classic] nav button.plus{color:#15152b}}
.sheet{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:20;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s linear .35s}
.sheet.open{opacity:1;visibility:visible;transition-delay:0s}
.box{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(100%);transition:transform .4s cubic-bezier(.22,.8,.3,1)}
.sheet.open .box{transform:none}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:0;padding:9px;border-radius:10px;font:inherit;color:var(--tx);cursor:pointer;transition:background .25s}
.seg button.on{background:var(--bg);font-weight:600;box-shadow:0 1px 3px #0002}
#amt{font-size:32px;text-align:center;direction:ltr;margin-bottom:10px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

.cats button span{font-size:22px}.cats button.on{border-color:var(--acc)}
.acts{display:flex;gap:10px;margin-top:14px}
.acts button{flex:1;padding:13px;border-radius:14px;border:0;font:inherit;font-weight:600;cursor:pointer}
.ok{background:var(--btn);color:#fff}.no{background:var(--card);color:var(--tx)}
.hide{display:none}
#toast{position:fixed;bottom:110px;left:50%;transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;z-index:40;pointer-events:none;max-width:90%;text-align:center}

.chart{display:flex;gap:3px;height:170px;background:var(--card);border-radius:16px;padding:14px 10px 8px;margin:4px 0 8px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.bs{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:1px}

.emo{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0;max-height:120px;overflow-y:auto}

#catForm input{margin-bottom:4px}

function drawCats(){const l=listFor(type);$('cats').innerHTML=l.map((c,i)=>`<button data-i="${i}" class="${i===cat?'on':''}"><span>${c[1]}</span>${esc(catName(c[0]))}</button>`).join('')+`<button data-new="1"><span>＋</span>${t('newCat')}</button>`}
function showForm(on){$('note').classList.toggle('hide',on);$('mainActs').classList.toggle('hide',on);if(on)$('delWrap').classList.add('hide');else $('delWrap').classList.toggle('hide',!editId);$('catForm').classList.toggle('hide',!on);$('cats').classList.toggle('hide',on);if(on){$('cName').value='';$('cIcon').value='🏷️';$('emo').innerHTML=EMO.map(e=>`<button data-e="${e}">${e}</button>`).join('');setTimeout(()=>$('cName').focus(),50)}}
function setType(ty){type=ty;cat=0;$('tExp').classList.toggle('on',ty==='exp');$('tInc').classList.toggle('on',ty==='inc');drawCats()}
function inFmt(v){
  v=v.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٫]/g,'.').replace(/[^0-9.]/g,'');
  const dot=v.includes('.')&&dec();let[i,...r]=v.split('.');i=i.replace(/^0+(?=\d)/,'').slice(0,15);const f=r.join('').slice(0,2);
  if(!i&&!dot)return'';return nd((i||'0').replace(/\B(?=(\d{3})+(?!\d))/g,','))+(dot?nd('.')+nd(f):'');
}
function updAmtW(){$('amtW').textContent=moneyWords(pn($('amt').value))}
$('amt').addEventListener('input',e=>{e.target.value=inFmt(e.target.value);updAmtW()});
function openSheet(x){
  editId=x?x.id:null;type=x?x.type:'exp';const l=listFor(type);showForm(false);cat=x?Math.max(0,l.findIndex(c=>c[0]===x.k)):0;
  $('amt').value=x?inFmt(String(dec()?x.amt:Math.round(x.amt))):'';updAmtW();$('note').value=x?x.note||'':'';
  $('tExp').classList.toggle('on',type==='exp');$('tInc').classList.toggle('on',type==='inc');
  $('delWrap').classList.toggle('hide',!x);drawCats();$('sheet').classList.add('open');setTimeout(()=>$('amt').focus(),350);
}
const closeSheet=()=>$('sheet').classList.remove('open');
$('addBtn').onclick=()=>openSheet();
$('tExp').onclick=()=>setType('exp');$('tInc').onclick=()=>setType('inc');
$('cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.new){showForm(true);return}cat=+b.dataset.i;drawCats()};
$('emo').onclick=e=>{const b=e.target.closest('[data-e]');if(b)$('cIcon').value=b.dataset.e};
$('cNo').onclick=()=>showForm(false);
$('cOk').onclick=()=>{
  const name=$('cName').value.trim();if(!name){$('cName').focus();return}
  const v=$('cIcon').value.trim()||'🏷️';let ic=v;try{ic=[...new Intl.Segmenter().segment(v)][0].segment}catch(e){ic=Array.from(v)[0]}
  const k='c'+Date.now();S.custom.push({k,name,icon:ic,type});save();
  cat=listFor(type).findIndex(c=>c[0]===k);showForm(false);drawCats();renderSettings();
};
$('cancel').onclick=closeSheet;
$('sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};
$('save').onclick=()=>{
  const amt=pn($('amt').value);if(!(amt>0)){$('amt').focus();return}
  const c=listFor(type)[cat],note=$('note').value.trim();
  if(editId){Object.assign(S.tx.find(x=>x.id===editId),{type,amt,k:c[0],note})}
  else S.tx.push({id:Date.now(),t:Date.now(),type,amt,k:c[0],note});
  save();closeSheet();renderAll();
};
$('del').onclick=()=>{if(confirm(t('confDel'))){S.tx=S.tx.filter(x=>x.id!==editId);save();closeSheet();renderAll()}};
const openRow=e=>{const r=e.target.closest('.row');if(r)openSheet(S.tx.find(x=>x.id==r.dataset.id))};
$('list').onclick=openRow;$('res').onclick=openRow;$('q').oninput=doSearch;

/* ---------- settings actions ---------- */
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
$('p-set').addEventListener('change',e=>{
  const id=e.target.id;if(id==='sLang')S.lang=e.target.value;else if(id==='sCal')S.cal=e.target.value;else if(id==='sCur')S.cur=e.target.value;else return;
  save();renderAll();
});
$('p-set').addEventListener('input',e=>{if(e.target.id==='email'){S.email=e.target.value.trim();save()}});
$('p-set').addEventListener('click',async e=>{
  const dc=e.target.closest('[data-dc]');if(dc){if(confirm(t('confDelCat'))){const k=dc.dataset.dc;S.custom=S.custom.filter(c=>c.k!==k);S.tx.forEach(x=>{if(x.k===k)x.k=x.type==='inc'?'other_i':'other'});save();renderAll()}return}
  const th=e.target.closest('[data-th]');if(th){S.theme=th.dataset.th;save();renderAll();return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='wipe'){if(confirm(t('confWipe'))){S.tx=[];S.custom=[];save();renderAll()}}
  else if(a==='restore')$('file').click();
  else if(a==='xl'){download(makeFile());toast(t('saved'))}
  else if(a==='mail')sendMail();
});
function download(f){const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function sendMail(){
  const f=makeFile();
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:t('mailSub'),text:t('mailBody')});return}}catch(e){if(e&&e.name==='AbortError')return}
  download(f);
  setTimeout(()=>{location.href='mailto:'+encodeURIComponent(S.email)+'?subject='+encodeURIComponent(t('mailSub'))+'&body='+encodeURIComponent(t('mailBody'))},600);
}

/* ---------- Excel (xlsx) writer / reader, no libraries ---------- */
const MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=~0;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(~c)>>>0};
function zip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  files.forEach(f=>{
    const n=enc.encode(f.name),d=enc.encode(f.data),c=crc32(d);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,n.length,true);
    parts.push(new Uint8Array(h.buffer),n,d);
    const ce=new DataView(new ArrayBuffer(46));ce.setUint32(0,0x02014b50,true);ce.setUint16(4,20,true);ce.setUint16(6,20,true);ce.setUint16(8,0x0800,true);ce.setUint32(16,c,true);ce.setUint32(20,d.length,true);ce.setUint32(24,d.length,true);ce.setUint16(28,n.length,true);ce.setUint32(42,off,true);
    cen.push(new Uint8Array(ce.buffer),n);off+=30+n.length+d.length;
  });
  const cl=cen.reduce((a,x)=>a+x.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:MIME});
}
const ymd=ts=>{const d=new Date(ts),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const ymdhm=ts=>{const d=new Date(ts),p=n=>String(n).padStart(2,'0');return ymd(ts)+' '+p(d.getHours())+':'+p(d.getMinutes())};
const xe=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');
function makeFile(){
  const rows=[['ID','Date','Type','Category','CategoryName','Amount','Note','Currency','Icon'],
   ...[...S.tx].sort((a,b)=>a.t-b.t).map(x=>[String(x.id),ymdhm(x.t),x.type==='inc'?'income':'expense',x.k,catName(x.k),x.amt,x.note||'',S.cur,icon(x.k)])];
  const col=i=>String.fromCharCode(65+i);
  const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="1" width="16" customWidth="1"/><col min="2" max="2" width="18" customWidth="1"/><col min="3" max="9" width="14" customWidth="1"/></cols><sheetData>'+
   rows.map((r,i)=>`<row r="${i+1}">`+r.map((v,j)=>typeof v==='number'?`<c r="${col(j)}${i+1}"><v>${v}</v></c>`:`<c r="${col(j)}${i+1}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`).join('')+'</row>').join('')+'</sheetData></worksheet>';
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const files=[
   {name:'[Content_Types].xml',data:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
   {name:'_rels/.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
   {name:'xl/workbook.xml',data:H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Transactions" sheetId="1" r:id="rId1"/></sheets></workbook>'},
   {name:'xl/_rels/workbook.xml.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
   {name:'xl/styles.xml',data:H+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
   {name:'xl/worksheets/sheet1.xml',data:sheet}];
  return new File([zip(files)],'dakhl-khasj-'+ymd(Date.now())+'.xlsx',{type:MIME});
}
async function unzip(buf){
  const v=new DataView(buf),u8=new Uint8Array(buf);let e=u8.length-22;
  while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw 0;
  const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const out={};
  for(let i=0;i<n;i++){
    if(v.getUint32(p,true)!==0x02014b50)throw 0;
    const m=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    const ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);let d=u8.subarray(ds,ds+cs);
    if(m===8)d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());else if(m!==0)throw 0;
    out[name]=d;p+=46+nl+el+cl;
  }
  return out;
}
function readRows(F){
  const td=new TextDecoder(),P=new DOMParser(),X=n=>P.parseFromString(td.decode(F[n]),'application/xml');
  let ss=[];if(F['xl/sharedStrings.xml'])ss=[...X('xl/sharedStrings.xml').getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(q=>q.textContent).join(''));
  const sn=Object.keys(F).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0];if(!sn)throw 0;
  return[...X(sn).getElementsByTagName('row')].map(r=>{const o=[];[...r.getElementsByTagName('c')].forEach(c=>{
    let ci=0;for(const ch of(c.getAttribute('r')||'').replace(/\d/g,''))ci=ci*26+ch.charCodeAt(0)-64;ci--;
    const ty=c.getAttribute('t');let val;
    if(ty==='inlineStr')val=[...c.getElementsByTagName('t')].map(q=>q.textContent).join('');
    else{const q=c.getElementsByTagName('v')[0];val=q?q.textContent:'';if(ty==='s')val=ss[+val]||''}
    o[ci]=val});return o});
}
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const rows=readRows(await unzip(await f.arrayBuffer())),out=[],seen=new Set(),nc=[];
    rows.slice(1).forEach((r,i)=>{
      if(!r||r[5]==null)return;const amt=pn(r[5]);if(!(amt>0))return;
      const ty=String(r[2]||'').toLowerCase().startsWith('inc')?'inc':'exp';
      let ts;const ds=String(r[1]||'').trim();
      if(/^\d+(\.\d+)?$/.test(ds))ts=Math.round((+ds-25569)*864e5)+new Date().getTimezoneOffset()*6e4;else ts=new Date(ds.replace(' ','T')).getTime();
      if(!isFinite(ts))ts=Date.now();
      let k=String(r[3]||'').trim();
      if(ICON[k]){if((ty==='inc')!==INC.some(c=>c[0]===k))k=ty==='inc'?'other_i':'other'}
      else if(!cu(k)&&!nc.some(c=>c.k===k)){if(/^c\d+$/.test(k)&&r[4])nc.push({k,name:String(r[4]),icon:String(r[8]||'🏷️'),type:ty});else k=ty==='inc'?'other_i':'other'}
      let id=/^\d+$/.test(String(r[0]||''))?+r[0]:Date.now()+i;while(seen.has(id))id++;seen.add(id);
      out.push({id,t:ts,type:ty,amt,k,note:String(r[6]||'')});
    });
    if(!out.length)throw 0;
    if(!confirm(t('confRest')))return;
    nc.forEach(c=>S.custom.push(c));S.tx=out;save();renderAll();toast(t('restOk')+' '+nd(out.length));
  }catch(err){toast(t('restErr'))}
};

/* ---------- start ---------- */
renderAll();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
